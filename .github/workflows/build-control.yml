name: 生成并签名云控

on:
  push:
    branches: [main]
    paths: ["control/**", "keys/**", "scripts/**", ".github/workflows/build-control.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-control
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验、生成、签名
        env:
          SALAMCLOUD_SIGNING_KEY: ${{ secrets.SALAMCLOUD_SIGNING_KEY }}
        run: python3 scripts/salamcloud.py build
      - name: 提交
        run: |
          git config user.name "salam-cloud-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/v1
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "chore: 生成并签名云控 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
