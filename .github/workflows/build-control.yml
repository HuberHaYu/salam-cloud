name: build

on:
  push:
    branches: [main]
    paths: ["control/**", "keys/**", "scripts/**", ".github/workflows/build-control.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-control
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and sign
        env:
          SALAMCLOUD_SIGNING_KEY: ${{ secrets.SALAMCLOUD_SIGNING_KEY }}
        run: python3 scripts/salamcloud.py build
      - name: commit
        run: |
          git config user.name "salam-cloud-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/v1
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: purge jsDelivr cache
        # jsDelivr caches @main for hours; without this, CDN routes keep serving the previous
        # (still validly signed) control file and apps never see the new one.
        run: |
          for f in api/v1/control.json api/v1/control.json.sig; do
            curl -fsS -m 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || echo "purge $f failed"
            echo
          done
